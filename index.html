<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Vault Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; min-height: 100vh; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2); }
        .glass-input { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; }
        .glass-input:focus { border-color: #38bdf8; outline: none; background: rgba(0, 0, 0, 0.3); }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8 font-sans">
    <nav class="max-w-5xl mx-auto flex justify-between items-center mb-8 glass-panel p-5 rounded-2xl">
        <h1 class="text-2xl font-bold text-sky-400 tracking-wide"><i class="fa-solid fa-vault mr-3"></i>Lua Vault</h1>
    </nav>

    <div id="toast" class="fixed top-5 right-5 text-white px-6 py-3 rounded-lg shadow-xl transform transition-transform duration-300 translate-x-full z-50 flex items-center">
        <i class="fa-solid fa-circle-check mr-2" id="toastIcon"></i> <span id="toastMsg" class="font-medium"></span>
    </div>

    <div id="dashboardView" class="max-w-5xl mx-auto space-y-8">
        <div class="glass-panel p-8 rounded-2xl">
            <h2 class="text-xl font-semibold mb-5 text-sky-300"><i class="fa-solid fa-cloud-arrow-up mr-2"></i>Upload New Script</h2>
            <div class="flex flex-col md:flex-row gap-4 items-center">
                <input type="file" id="fileInput" class="block w-full text-sm text-slate-300 file:mr-4 file:py-2.5 file:px-5 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-sky-500/20 file:text-sky-300 hover:file:bg-sky-500/30 transition cursor-pointer glass-input rounded-lg p-2">
                <button onclick="uploadFile()" id="uploadBtn" class="bg-sky-500 hover:bg-sky-400 text-white px-8 py-3 rounded-lg font-bold transition shadow-[0_0_15px_rgba(14,165,233,0.3)] w-full md:w-auto flex items-center justify-center">
                    <i class="fa-solid fa-upload mr-2"></i>Upload
                </button>
            </div>
        </div>

        <div class="glass-panel rounded-2xl overflow-hidden">
            <div class="p-5 border-b border-white/10 flex flex-col sm:flex-row justify-between items-center gap-4 bg-black/10">
                <h2 class="text-xl font-semibold text-sky-300 whitespace-nowrap"><i class="fa-solid fa-list mr-2"></i>Vault Scripts</h2>
                <div class="relative w-full max-w-md">
                    <i class="fa-solid fa-search absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="text" id="searchInput" onkeyup="filterSearch()" placeholder="Search exact ID..." class="w-full glass-input rounded-lg pl-11 pr-4 py-2.5 transition">
                </div>
                <button onclick="loadFiles(true)" id="refreshBtn" class="text-sky-400 hover:text-sky-300 whitespace-nowrap glass-panel hover:bg-white/5 px-4 py-2.5 rounded-lg transition"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <tbody id="fileList" class="divide-y divide-white/5">
                        <tr><td class="p-10 text-center text-slate-400"><i class="fa-solid fa-spinner spin mr-2"></i>Fetching vault data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="editView" class="max-w-5xl mx-auto glass-panel p-8 rounded-2xl hidden">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h2 class="text-2xl font-bold text-white"><i class="fa-solid fa-pen-to-square text-sky-400 mr-2"></i>Edit Script</h2>
                <div class="flex gap-4 mt-3 items-center">
                    <p class="text-sm text-slate-400">Fixed ID: <span id="editIdDisplay" class="font-mono text-sky-400 bg-black/30 px-3 py-1.5 rounded-md select-all border border-white/10"></span></p>
                    <input type="text" id="editFileName" class="glass-input text-sm rounded-md px-3 py-1.5 w-48">
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="copyCode()" class="glass-panel hover:bg-white/10 text-white px-5 py-2.5 rounded-lg transition text-sm flex items-center"><i class="fa-solid fa-copy mr-2"></i>Copy</button>
                <button onclick="closeEdit()" class="glass-panel hover:bg-white/10 text-white px-5 py-2.5 rounded-lg transition text-sm flex items-center"><i class="fa-solid fa-xmark mr-2"></i>Close</button>
            </div>
        </div>

        <div class="mb-5 bg-black/20 p-5 rounded-xl border border-white/5 flex flex-col md:flex-row justify-between items-center gap-4">
            <label class="text-sm font-medium text-slate-300 whitespace-nowrap"><i class="fa-solid fa-file-import mr-2 text-sky-400"></i>Overwrite from file:</label>
            <input type="file" id="replaceFileInput" onchange="loadReplaceFile(event)" class="block w-full text-sm text-slate-400 file:mr-4 file:py-1.5 file:px-4 file:rounded-md file:border-0 file:bg-sky-500/20 file:text-sky-300 hover:file:bg-sky-500/30 cursor-pointer transition">
        </div>

        <textarea id="editContent" spellcheck="false" class="w-full bg-[#0a0f18]/80 border border-white/10 rounded-xl p-5 text-[#e2e8f0] font-mono text-sm focus:outline-none focus:border-sky-400/50 mb-5 resize-y shadow-inner" style="height: 55vh;"></textarea>
        <input type="hidden" id="editFileId">
        <button onclick="saveEdit()" id="saveBtn" class="w-full bg-sky-500 hover:bg-sky-400 text-white px-6 py-3.5 rounded-xl font-bold transition shadow-[0_0_15px_rgba(14,165,233,0.3)] flex items-center justify-center text-lg">
            Save & Update Immutable Link
        </button>
    </div>

    <script>
        const API_URL = '/.netlify/functions/api';

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMsg');
            const icon = document.getElementById('toastIcon');
            toast.className = `fixed top-5 right-5 text-white px-6 py-3.5 rounded-lg shadow-xl transform transition-transform duration-300 z-50 flex items-center border ${isError ? 'bg-red-500/90 border-red-400' : 'bg-emerald-500/90 border-emerald-400'} backdrop-blur-md`;
            icon.className = isError ? 'fa-solid fa-circle-exclamation mr-2' : 'fa-solid fa-circle-check mr-2';
            msgEl.innerText = message;
            toast.classList.remove('translate-x-full');
            setTimeout(() => toast.classList.add('translate-x-full'), 3000);
        }

        async function fetchLive(url, options = {}) {
            const targetUrl = new URL(url, window.location.origin);
            targetUrl.searchParams.append('_t', Date.now());
            
            const res = await fetch(targetUrl.toString(), {
                ...options,
                headers: {
                    ...options.headers,
                    'Cache-Control': 'no-cache, no-store',
                    'Pragma': 'no-cache'
                },
                cache: 'no-store'
            });

            if (res.status === 404) throw new Error("API not deployed");
            if (!res.ok) throw new Error(`Server Error ${res.status}`);
            return res;
        }

        function filterSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.file-row').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
            });
        }

        function copyRawLink(id) {
            const link = `${window.location.origin}/raw/${id}`;
            navigator.clipboard.writeText(link).then(() => showToast("Immutable Raw Link Copied!"));
        }

        function openRawLink(id) {
            window.open(`/raw/${id}?_t=${Date.now()}`, '_blank');
        }

        function copyCode() {
            navigator.clipboard.writeText(document.getElementById('editContent').value).then(() => showToast("Code Copied!"));
        }

        function closeEdit() {
            document.getElementById('editView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            loadFiles();
        }

        async function downloadFile(id) {
            try {
                showToast("Preparing download...");
                const res = await fetchLive(`${API_URL}?id=${id}`);
                const data = await res.json();
                const blob = new Blob([data.content], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = data.filename || `script_${id}.lua`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                showToast("Download failed", true);
            }
        }

        function renderRow(id) {
            return `
                <tr class="file-row hover:bg-white/5 transition group flex flex-col md:flex-row justify-between items-center p-5 border-b border-white/5" id="row-${id}">
                    <td class="font-mono text-sky-300 font-bold text-lg select-all w-full md:w-auto mb-4 md:mb-0 tracking-wider">${id}</td>
                    <td class="flex flex-wrap gap-2.5 justify-end w-full md:w-auto">
                        <button onclick="copyRawLink('${id}')" class="bg-indigo-500/20 text-indigo-300 hover:bg-indigo-500 hover:text-white border border-indigo-500/30 px-3 py-2 rounded-lg transition text-sm flex items-center"><i class="fa-solid fa-link mr-2"></i>Copy Link</button>
                        <button onclick="openRawLink('${id}')" class="bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500 hover:text-white border border-emerald-500/30 px-3 py-2 rounded-lg transition text-sm flex items-center"><i class="fa-solid fa-file-code mr-2"></i>Raw</button>
                        <button onclick="downloadFile('${id}')" class="bg-sky-500/20 text-sky-300 hover:bg-sky-500 hover:text-white border border-sky-500/30 px-3 py-2 rounded-lg transition text-sm flex items-center"><i class="fa-solid fa-download mr-2"></i>Download</button>
                        <button onclick="openEdit('${id}')" class="bg-amber-500/20 text-amber-300 hover:bg-amber-500 hover:text-white border border-amber-500/30 px-3 py-2 rounded-lg transition text-sm flex items-center"><i class="fa-solid fa-pen mr-2"></i>Edit</button>
                        <button onclick="deleteFile('${id}')" class="bg-rose-500/20 text-rose-300 hover:bg-rose-500 hover:text-white border border-rose-500/30 px-3 py-2 rounded-lg transition text-sm flex items-center"><i class="fa-solid fa-trash mr-2"></i>Delete</button>
                    </td>
                </tr>
            `;
        }

        async function loadFiles(manualRefresh = false) {
            const listEl = document.getElementById('fileList');
            const refreshBtn = document.getElementById('refreshBtn');
            if (manualRefresh) refreshBtn.innerHTML = '<i class="fa-solid fa-spinner spin"></i>';

            try {
                const res = await fetchLive(API_URL);
                const blobs = await res.json();
                
                if (!Array.isArray(blobs) || blobs.length === 0) {
                    listEl.innerHTML = `<tr><td class="p-12 text-center text-slate-400"><i class="fa-solid fa-box-open text-4xl mb-3 block opacity-50"></i> Vault is empty.</td></tr>`;
                } else {
                    listEl.innerHTML = blobs.map(blob => renderRow(blob.key)).join('');
                }
                filterSearch();
            } catch (err) {
                listEl.innerHTML = `<tr><td class="p-6 text-rose-400 text-center bg-rose-500/10 rounded-lg m-4 block"><i class="fa-solid fa-triangle-exclamation mr-2"></i> ${err.message}</td></tr>`;
            } finally {
                if (manualRefresh) refreshBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const btn = document.getElementById('uploadBtn');
            if (!fileInput.files.length) return showToast("Select a file first!", true);
            
            btn.innerHTML = '<i class="fa-solid fa-spinner spin mr-2"></i>Uploading...';
            btn.disabled = true;
            
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = async function(e) {
                try {
                    await fetchLive(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: file.name, content: e.target.result })
                    });
                    fileInput.value = "";
                    showToast("Uploaded Successfully!");
                    await loadFiles();
                } catch (err) {
                    showToast("Upload Failed", true);
                } finally {
                    btn.innerHTML = '<i class="fa-solid fa-upload mr-2"></i>Upload';
                    btn.disabled = false;
                }
            };
            reader.readAsText(file);
        }

        function loadReplaceFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('editContent').value = e.target.result;
                document.getElementById('editFileName').value = file.name;
                showToast("File loaded into editor!");
            };
            reader.readAsText(file);
        }

        async function openEdit(id) {
            try {
                showToast("Loading script...");
                const res = await fetchLive(`${API_URL}?id=${id}`);
                const data = await res.json();
                
                document.getElementById('dashboardView').classList.add('hidden');
                document.getElementById('editView').classList.remove('hidden');
                document.getElementById('editIdDisplay').innerText = data.id;
                document.getElementById('editFileId').value = data.id;
                document.getElementById('editFileName').value = data.filename || `script_${data.id}.lua`;
                document.getElementById('editContent').value = data.content;
                document.getElementById('replaceFileInput').value = ""; 
            } catch (err) {
                showToast("Failed to load script data.", true);
            }
        }

        async function saveEdit() {
            const id = document.getElementById('editFileId').value;
            const filename = document.getElementById('editFileName').value;
            const content = document.getElementById('editContent').value;
            const btn = document.getElementById('saveBtn');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner spin mr-2"></i>Saving...';
            btn.disabled = true;
            
            try {
                await fetchLive(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, filename, content })
                });
                showToast("Link Updated Successfully!");
                closeEdit();
            } catch (err) {
                showToast("Error updating file.", true);
            } finally {
                btn.innerHTML = "Save & Update Immutable Link";
                btn.disabled = false;
            }
        }

        async function deleteFile(id) {
            if (!confirm(`Are you sure you want to permanently delete '${id}'?`)) return;
            
            const row = document.getElementById(`row-${id}`);
            if(row) row.remove();
            
            try {
                await fetchLive(API_URL, { 
                    method: 'DELETE', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id }) 
                });
                showToast("Deleted Successfully");
            } catch (err) {
                showToast("Delete Failed", true);
                loadFiles(true); 
            }
        }

        window.onload = () => {
            loadFiles();
        };
    </script>
</body>
</html>
