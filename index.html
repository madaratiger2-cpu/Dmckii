<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Vault Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    
    <nav class="max-w-5xl mx-auto flex justify-between items-center mb-8 bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700 fade-in">
        <h1 class="text-2xl font-bold text-cyan-400 tracking-wide"><i class="fa-solid fa-vault mr-2"></i>Lua Vault</h1>
        <button onclick="logout()" id="logoutBtn" class="text-slate-300 hover:text-red-400 transition-all duration-300 hidden font-medium">
            <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
        </button>
    </nav>

    <div id="toast" class="fixed top-5 right-5 text-white px-6 py-4 rounded-xl shadow-2xl transform transition-transform duration-300 translate-x-full z-50 flex items-center font-medium">
        <i class="fa-solid fa-circle-check text-xl mr-3" id="toastIcon"></i> <span id="toastMsg">Success</span>
    </div>

    <div id="loginView" class="max-w-md mx-auto glass-panel p-10 rounded-2xl shadow-2xl mt-20 text-center fade-in">
        <div class="bg-cyan-500/20 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fa-solid fa-shield-halved text-cyan-400 text-3xl"></i>
        </div>
        <h2 class="text-3xl font-bold text-white mb-2">Secure Access</h2>
        <p class="text-slate-400 text-sm mb-8">Enter your vault password to continue.</p>
        <input type="password" id="vaultPassword" placeholder="Enter Password..." class="w-full bg-slate-900/50 border border-slate-600 text-white rounded-xl px-4 py-4 mb-6 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-center text-lg tracking-widest" onkeypress="if(event.key === 'Enter') checkLogin()">
        <button onclick="checkLogin()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-8 py-4 rounded-xl font-bold w-full transition-all duration-300 shadow-lg shadow-cyan-500/25 hover:shadow-cyan-500/40 hover:-translate-y-1">
            Unlock Vault 🔓
        </button>
    </div>

    <div id="dashboardView" class="max-w-5xl mx-auto space-y-6 hidden fade-in">
        <div class="glass-panel p-6 rounded-2xl shadow-xl hover:border-slate-500 transition-all duration-300">
            <h2 class="text-xl font-semibold mb-4 text-white"><i class="fa-solid fa-cloud-arrow-up text-cyan-400 mr-2"></i>Upload New Script</h2>
            <div class="flex flex-col md:flex-row gap-4 items-center">
                <input type="file" id="fileInput" class="block w-full text-sm text-slate-400 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-cyan-900/50 file:text-cyan-300 hover:file:bg-cyan-800 cursor-pointer transition-all">
                <button onclick="uploadFile()" id="uploadBtn" class="bg-cyan-600 hover:bg-cyan-500 text-white px-10 py-3 rounded-xl font-bold transition-all duration-300 shadow-lg shadow-cyan-500/30 whitespace-nowrap w-full md:w-auto hover:-translate-y-1">
                    <i class="fa-solid fa-upload mr-2"></i>Upload
                </button>
            </div>
        </div>

        <div class="glass-panel rounded-2xl shadow-xl overflow-hidden border-slate-700">
            <div class="p-5 bg-slate-800/80 border-b border-slate-700 flex flex-col sm:flex-row justify-between items-center gap-4">
                <h2 class="text-xl font-semibold text-white whitespace-nowrap"><i class="fa-solid fa-list text-cyan-400 mr-2"></i>Your Scripts</h2>
                <div class="relative w-full max-w-md">
                    <i class="fa-solid fa-search absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="text" id="searchInput" onkeyup="filterSearch()" placeholder="Search ID..." class="w-full bg-slate-900/50 border border-slate-600 text-white rounded-xl pl-12 pr-4 py-3 focus:outline-none focus:border-cyan-400 transition-all">
                </div>
                <button onclick="loadFiles(true)" id="refreshBtn" class="text-cyan-400 hover:text-white bg-slate-700 hover:bg-slate-600 p-3 rounded-xl transition-all duration-300 shadow-md">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <tbody id="fileList" class="divide-y divide-slate-700/50">
                        <tr><td class="p-8 text-center text-slate-400"><i class="fa-solid fa-spinner spin mr-2"></i>Loading live data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="editView" class="max-w-5xl mx-auto glass-panel p-6 rounded-2xl shadow-xl hidden fade-in">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <h2 class="text-2xl font-bold text-white"><i class="fa-solid fa-pen-to-square text-yellow-400 mr-2"></i>Edit Script</h2>
                <div class="flex gap-4 mt-2 items-center">
                    <p class="text-sm text-slate-400">ID: <span id="editIdDisplay" class="font-mono text-cyan-400 bg-slate-800 px-3 py-1 rounded-lg select-all"></span></p>
                    <input type="text" id="editFileName" class="bg-slate-900 text-slate-300 text-sm border border-slate-600 rounded-lg px-3 py-1.5 focus:outline-none focus:border-cyan-400">
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="copyCode()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2.5 rounded-xl transition-all shadow-md text-sm"><i class="fa-solid fa-copy mr-1"></i> Copy Code</button>
                <button onclick="showDashboard(false)" class="bg-red-900/50 hover:bg-red-800 text-red-300 hover:text-white px-4 py-2.5 rounded-xl transition-all shadow-md text-sm"><i class="fa-solid fa-xmark mr-1"></i> Cancel</button>
            </div>
        </div>

        <div class="mb-5 bg-slate-800/80 p-4 rounded-xl border border-slate-700 flex flex-col md:flex-row justify-between items-center gap-4">
            <label class="text-sm font-medium text-slate-300 whitespace-nowrap"><i class="fa-solid fa-file-import mr-1 text-yellow-400"></i> Upload to Replace:</label>
            <input type="file" id="replaceFileInput" onchange="loadReplaceFile(event)" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-yellow-900/40 file:text-yellow-300 hover:file:bg-yellow-900/60 cursor-pointer transition-all">
        </div>

        <textarea id="editContent" spellcheck="false" class="w-full bg-[#1e1e1e] border border-slate-700 rounded-xl p-5 text-[#d4d4d4] font-mono text-sm focus:outline-none focus:border-cyan-400 mb-5 resize-y shadow-inner" style="height: 50vh;"></textarea>
        <input type="hidden" id="editFileId">
        
        <button onclick="saveEdit()" id="saveBtn" class="w-full bg-gradient-to-r from-yellow-600 to-yellow-500 hover:from-yellow-500 hover:to-yellow-400 text-white px-6 py-4 rounded-xl font-bold transition-all duration-300 shadow-lg shadow-yellow-500/30 hover:-translate-y-1">
            <i class="fa-solid fa-floppy-disk mr-2"></i>Save & Update Live (Raw Link Preserved)
        </button>
    </div>

    <script>
        const API_URL = '/.netlify/functions/api';
        let currentPassword = localStorage.getItem("vault_pwd") || "";
        let localPendingFiles = JSON.parse(localStorage.getItem('pending_files') || '[]');

        if(currentPassword) checkLogin(true);

        async function fetchLive(url, options = {}) {
            const liveUrl = new URL(url, window.location.origin);
            liveUrl.searchParams.append('_t', Date.now());
            return fetch(liveUrl.toString(), { 
                ...options, 
                headers: { 
                    ...options.headers, 
                    'Cache-Control': 'no-cache, no-store', 
                    'Pragma': 'no-cache',
                    'x-admin-password': currentPassword 
                },
                cache: 'no-store' 
            });
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMsg');
            const icon = document.getElementById('toastIcon');
            toast.className = `fixed top-5 right-5 text-white px-6 py-4 rounded-xl shadow-2xl transform transition-all duration-300 z-50 flex items-center font-medium ${isError ? 'bg-red-500' : 'bg-emerald-500'}`;
            icon.className = isError ? 'fa-solid fa-circle-exclamation text-xl mr-3' : 'fa-solid fa-circle-check text-xl mr-3';
            msgEl.innerText = message;
            toast.classList.remove('translate-x-full');
            setTimeout(() => toast.classList.add('translate-x-full'), 3000);
        }

        async function checkLogin(silentLoad = false) {
            if (!silentLoad) currentPassword = document.getElementById('vaultPassword').value;
            if(!currentPassword) return showToast("Password cannot be empty!", true);

            try {
                const res = await fetchLive(API_URL);
                if (res.status === 401) {
                    currentPassword = "";
                    localStorage.removeItem("vault_pwd");
                    return showToast("Access Denied! Incorrect Password ❌", true);
                }
                
                localStorage.setItem("vault_pwd", currentPassword);
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
                if(!silentLoad) showToast("Vault Unlocked! 🔓");
                
                loadFiles(); 
            } catch (err) {
                showToast("Connection Error", true);
            }
        }

        function logout() {
            currentPassword = "";
            localStorage.removeItem("vault_pwd");
            document.getElementById('vaultPassword').value = "";
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('editView').classList.add('hidden');
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
            showToast("Logged Out Successfully");
        }

        function showDashboard(forceReload = false) {
            document.getElementById('editView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            if(forceReload) loadFiles();
        }

        function filterSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.file-row').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
            });
        }

        function getCleanRawLink(id) {
            return `${window.location.origin}/raw/${id}`;
        }

        function copyRawLink(id) {
            navigator.clipboard.writeText(getCleanRawLink(id)).then(() => showToast("Clean Link Copied! 📋"));
        }

        function openRawLink(id) {
            window.open(getCleanRawLink(id), '_blank');
        }

        async function downloadLua(id) {
            showToast("Preparing download...");
            try {
                const res = await fetch(getCleanRawLink(id));
                if (!res.ok) throw new Error("Network response was not ok");
                const text = await res.text();
                
                const blob = new Blob([text], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${id}.lua`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                showToast("Download Complete! 📥");
            } catch (err) {
                showToast("Download Failed", true);
            }
        }

        function copyCode() {
            navigator.clipboard.writeText(document.getElementById('editContent').value).then(() => showToast("Code Copied!"));
        }

        function renderRow(id) {
            return `
                <tr class="file-row hover:bg-slate-700/40 transition-all duration-200 group flex flex-col md:flex-row justify-between items-center p-5 border-b border-slate-700/50" id="row-${id}">
                    <td class="font-mono text-cyan-400 font-bold text-lg select-all w-full md:w-auto mb-4 md:mb-0">${id}</td>
                    <td class="flex flex-wrap gap-3 justify-end w-full md:w-auto">
                        <button onclick="copyRawLink('${id}')" class="bg-purple-900/40 text-purple-400 hover:bg-purple-600 hover:text-white px-4 py-2 rounded-lg transition-all text-sm font-medium"><i class="fa-solid fa-link mr-1"></i> Copy</button>
                        <button onclick="openRawLink('${id}')" class="bg-emerald-900/40 text-emerald-400 hover:bg-emerald-600 hover:text-white px-4 py-2 rounded-lg transition-all text-sm font-medium"><i class="fa-solid fa-file-code mr-1"></i> Raw</button>
                        <button onclick="downloadLua('${id}')" class="bg-blue-900/40 text-blue-400 hover:bg-blue-600 hover:text-white px-4 py-2 rounded-lg transition-all text-sm font-medium"><i class="fa-solid fa-download mr-1"></i> .lua</button>
                        <button onclick="openEdit('${id}')" class="bg-yellow-900/40 text-yellow-400 hover:bg-yellow-600 hover:text-white px-4 py-2 rounded-lg transition-all text-sm font-medium"><i class="fa-solid fa-pen mr-1"></i> Edit</button>
                        <button onclick="deleteFile('${id}')" class="bg-red-900/40 text-red-400 hover:bg-red-600 hover:text-white px-4 py-2 rounded-lg transition-all text-sm font-medium"><i class="fa-solid fa-trash mr-1"></i> Delete</button>
                    </td>
                </tr>
            `;
        }

        async function loadFiles(manualRefresh = false) {
            const listEl = document.getElementById('fileList');
            const refreshBtn = document.getElementById('refreshBtn');
            if (manualRefresh) refreshBtn.innerHTML = '<i class="fa-solid fa-spinner spin"></i>';

            try {
                const res = await fetchLive(API_URL);
                if (res.status === 401) return logout(); 
                if (!res.ok) throw new Error("Server Error");
                
                let blobs = await res.json();
                if (!Array.isArray(blobs)) blobs = [];
                
                const apiKeys = blobs.map(b => b.key);
                localPendingFiles = localPendingFiles.filter(id => !apiKeys.includes(id));
                localStorage.setItem('pending_files', JSON.stringify(localPendingFiles));
                const combinedList = [...localPendingFiles.map(id => ({ key: id })), ...blobs];

                if (combinedList.length === 0) {
                    listEl.innerHTML = `<tr><td class="p-12 text-center text-slate-500"><i class="fa-solid fa-box-open text-4xl mb-3 block opacity-50"></i> No scripts found. Upload one!</td></tr>`;
                } else {
                    listEl.innerHTML = combinedList.map(blob => renderRow(blob.key)).join('');
                }
                filterSearch();
            } catch (err) {
                listEl.innerHTML = `<tr><td class="p-8 text-red-400 text-center"><i class="fa-solid fa-triangle-exclamation mr-2"></i> Error loading live data</td></tr>`;
            } finally {
                if (manualRefresh) refreshBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const btn = document.getElementById('uploadBtn');
            if (!fileInput.files.length) return showToast("Select a file first!", true);
            
            btn.innerHTML = '<i class="fa-solid fa-spinner spin mr-2"></i>Uploading...';
            btn.disabled = true;
            
            const file = fileInput.files[0];
            const newId = Math.random().toString(36).substring(2, 10);
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    fileInput.value = "";
                    localPendingFiles.unshift(newId);
                    localStorage.setItem('pending_files', JSON.stringify(localPendingFiles));
                    
                    const listEl = document.getElementById('fileList');
                    if (listEl.innerText.includes('No scripts found') || listEl.innerText.includes('Loading')) {
                        listEl.innerHTML = ''; 
                    }
                    listEl.insertAdjacentHTML('afterbegin', renderRow(newId));

                    const res = await fetchLive(API_URL, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: newId, filename: file.name, content: e.target.result })
                    });
                    if (res.status === 401) throw new Error("Auth Failed");
                    if (!res.ok) throw new Error("Upload failed");
                    
                    showToast("Uploaded Successfully! 🚀");
                } catch (err) {
                    showToast("Upload Failed / Unauthorized", true);
                    document.getElementById(`row-${newId}`)?.remove();
                    localPendingFiles = localPendingFiles.filter(id => id !== newId);
                    localStorage.setItem('pending_files', JSON.stringify(localPendingFiles));
                } finally {
                    btn.innerHTML = '<i class="fa-solid fa-upload mr-2"></i>Upload';
                    btn.disabled = false;
                }
            };
            reader.readAsText(file);
        }

        function loadReplaceFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('editContent').value = e.target.result;
                document.getElementById('editFileName').value = file.name;
                showToast("File loaded into editor!");
            };
            reader.readAsText(file);
        }

        async function openEdit(id) {
            try {
                showToast("Loading script...");
                const res = await fetchLive(`${API_URL}?id=${id}`);
                if (!res.ok) throw new Error("Fetch failed");
                const data = await res.json();
                
                document.getElementById('dashboardView').classList.add('hidden');
                document.getElementById('editView').classList.remove('hidden');
                document.getElementById('editIdDisplay').innerText = data.id;
                document.getElementById('editFileId').value = data.id;
                document.getElementById('editFileName').value = data.filename || `script_${data.id}.lua`;
                document.getElementById('editContent').value = data.content;
                document.getElementById('replaceFileInput').value = ""; 
            } catch (err) {
                showToast("Failed to load script data.", true);
            }
        }

        async function saveEdit() {
            const id = document.getElementById('editFileId').value;
            const filename = document.getElementById('editFileName').value;
            const content = document.getElementById('editContent').value;
            const btn = document.getElementById('saveBtn');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner spin mr-2"></i>Saving...';
            btn.disabled = true;
            
            try {
                const res = await fetchLive(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, filename, content })
                });
                if (!res.ok) throw new Error("Save failed");
                
                showToast("Updated Live! ✨ Raw link remains permanent.");
                showDashboard(false); 
            } catch (err) {
                showToast("Error updating file.", true);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i>Save & Update Live (Raw Link Preserved)';
                btn.disabled = false;
            }
        }

        async function deleteFile(id) {
            if (!confirm(`Are you sure you want to delete '${id}'? This cannot be undone.`)) return;
            
            const row = document.getElementById(`row-${id}`);
            if(row) row.remove();
            
            localPendingFiles = localPendingFiles.filter(fileId => fileId !== id);
            localStorage.setItem('pending_files', JSON.stringify(localPendingFiles));
            
            try {
                const res = await fetchLive(API_URL, { 
                    method: 'DELETE', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id }) 
                });
                
                if (!res.ok) throw new Error("Delete failed");
                showToast("Deleted Successfully 🗑️");
            } catch (err) {
                showToast("Delete Failed", true);
                loadFiles(true); 
            }
        }
    </script>
</body>
</html>
